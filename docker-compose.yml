name: evalbench

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evalbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalbench}
      POSTGRES_DB: ${POSTGRES_DB:-evalbench}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database host is the "postgres" service.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evalbench}:${POSTGRES_PASSWORD:-evalbench}@postgres:5432/${POSTGRES_DB:-evalbench}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Demo seed script lives in data/demo; mounted so it can run inside the container.
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    environment:
      # Browser-side base URL for the API. Not a secret.
      VITE_API_BASE_URL: http://localhost:8000
      # Polling makes hot reload work on Windows/macOS bind mounts.
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
